# SPEC-v5.1 §6.4 knowing-of (helper B's draft, for the lead's review): for every catalog kind of tier 1 and up
# (grammar.recipe), the titles of Simple English Wikipedia's articles (book/wikipedia_en-simple_all_maxi_2026-09.zim)
# that teach the kind exists. A hob that reads one knows of the kind (pet["knows"], of = true, from "read"): it is not
# the recipe. Every title here was looked up in the zim by its path (21 October 2026); a redirect is listed under both
# its names, since book.read names a page by the title it was asked by. A kind with no fitting article has none.
# The tier-0 kinds (rug, nest, stool, box, shelf, bowl, broom, brush, stick, fork, spoon, flute, wind chime,
# sculpture, garland, stone stack) are made by paw without knowing, and have no line.

