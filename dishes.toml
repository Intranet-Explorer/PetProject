# Cooking (SPEC-v3.6b §2): what comes out of the pot on the stove. engine/cook.py carries it out; no model is asked.
# A hob puts what it has to hand in the pot (what it carries, and what lies about the room or is put by there); the
# richest dish that all of it makes comes out, one it has not found yet first. Water is always to hand at the stove.
#
#   [dish.<name>]
#     needs     the bits that go in, one of each
#     servings  how many can eat from the pot
#     food      what eating a serving does (energy, comfort), beside the bowl's meal and raw fish (pond.toml)
#     says      what the one who found it is told, the first time it comes out of the pot

[cook]
keep_days = 1.0           # a pot not eaten up in this long has gone stale, and is thrown out
kept_days = 3.0           # ... with a keeper in the room (a jar, a box, a basket, a pot kept for it) it keeps this long
together_hours = 2        # two hobs who eat from one pot within this many world hours have eaten together: company for both
company = 3.0             # ... this much
loves = 2                 # a hob loves at most this many dishes: the one its parent cooked for it when it was little, or one eaten three times
loved = 2.0               # the comfort of eating a dish it loves, on top
loved_after = 3           # ... eaten this many times, a dish is one it loves
hungry = 1                # a pot on the stove is wanted by a hob this hungry or more (feel.level of energy)
want = 3.0                # how strongly
cook_want = 2.5           # how strongly a hob that knows a dish and carries what it takes wants to cook it

[dish."grilled fish"]
needs = ["fish"]
servings = 2
food = { energy = 16.0, comfort = 2.0 }
says = "the fish browned and crisped in the hot pot, and smells better than anything: grilled fish"
