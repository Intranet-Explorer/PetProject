<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pet sheet</title>
<!-- A sheet of pictures for a report or a reviewer (SPEC-v3.5 §7): every living pet's sprite, and every thing the house
     invented, large, on a plain background. On a running house: /sheet.html
       ?names=0     a blind test: the pets in shuffled order with only a number under each, the things without what
                    they do (&key=1 adds the answers at the foot; &seed=3 another order)
       ?src=<url>   instead of the running house, a JSON file: { "pets": [{ "genome", "stage", "label", "family"?,
                    "parent"? (a label) }], "invented": [records] or { name: record } }, e.g. ?src=/art/x.json or any
                    address this page may fetch (a file copied into view/dist/ is served at /<its name>); or, from a
                    script on the page, showSheet(thatObject)
       ?all=1       the dead too · ?z=6 how large · ?bg=d9d2c3 the background · ?only=pets or things
     The page's title ends in "ready" when everything is drawn. -->
<style>
  body { margin: 24px; font: 15px/1.3 ui-sans-serif, system-ui, sans-serif; color: #2a2433; }
  h1 { font-size: 18px; margin: 0 0 4px; } h2 { font-size: 15px; margin: 22px 0 10px; } p { margin: 0 0 10px; color: #5d5568; }
  canvas { image-rendering: pixelated; display: block; margin: 0 auto; }
  .grid { display: flex; flex-wrap: wrap; gap: 18px 14px; align-items: flex-end; }
  figure { margin: 0; text-align: center; } figcaption { margin-top: 4px; max-width: 190px; } figcaption b { display: block; } figcaption span { color: #5d5568; font-size: 13px; }
  .fam { margin-bottom: 8px; } .n { font: 700 20px/1 ui-monospace, Menlo, monospace; }
  table { border-collapse: collapse; margin-top: 8px; } td, th { padding: 2px 10px; text-align: left; font-size: 13px; border-bottom: 1px solid #0002; }
</style>
</head>
<body>
<div id="out"></div>
<script type="module">
import { composeThing, loadParts } from "./src/parts.ts";
import { petPortrait } from "./src/petsprite.ts";

const q = new URLSearchParams(location.search), blind = q.get("names") === "0", Z = +(q.get("z") ?? 6), only = q.get("only");
document.body.style.background = `#${q.get("bg") ?? "d9d2c3"}`;
let seed = +(q.get("seed") ?? 1);
const rnd = () => ((seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296);
const out = document.getElementById("out");
const el = (tag, cls, parent, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; (parent ?? out).append(e); return e; };
const big = (src, z) => { const c = document.createElement("canvas"); c.width = src.width * z; c.height = src.height * z; const x = c.getContext("2d"); x.imageSmoothingEnabled = false; x.drawImage(src, 0, 0, c.width, c.height); return c; };

/** The running house: its first snapshot has every pet and every invented kind. */
const house = () => new Promise((done, fail) => {
  const sock = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  sock.onmessage = (e) => { const s = JSON.parse(e.data); if (!s.pets) return; sock.close(); done(s); };
  sock.onerror = () => fail(new Error("no house answers at /ws"));
});
await loadParts("/art");
function showSheet(data) {
out.replaceChildren();
const all = data.pets ?? [], label = (id) => all.find((p) => p.id === id)?.label ?? id ?? "";
let pets = all.filter((p) => p.genome && p.stage !== "egg" && (q.has("all") || p.stage !== "dead"));
const things = Array.isArray(data.invented) ? data.invented : Object.entries(data.invented ?? {}).map(([name, r]) => ({ name, ...r }));
const stageOf = (p) => (p.stage === "dead" ? p.stage_before ?? "adult" : p.stage);
const sprite = (p) => big(petPortrait(p.genome, stageOf(p), 1, { grey: stageOf(p) === "elder" ? 0.55 : 0 }), Z);

if (only !== "things") {
  el("h1", "", out, blind ? "Who is whose?" : "Every pet");
  if (blind) {
    el("p", "", out, `${pets.length} pets. Sort them into their families, and pair each child with its parent.`);
    pets = pets.map((p) => [rnd(), p]).sort((a, b) => a[0] - b[0]).map(([, p]) => p);
    const g = el("div", "grid");
    pets.forEach((p, i) => { const f = el("figure", "", g); f.append(sprite(p)); el("figcaption", "n", f, String(i + 1)); });
    if (q.has("key")) {
      el("h2", "", out, "Key");
      const t = el("table");
      el("tr", "", t).innerHTML = "<th>#</th><th>who</th><th>family</th><th>stage</th><th>child of</th>";
      pets.forEach((p, i) => { const r = el("tr", "", t); for (const v of [i + 1, p.label ?? p.name ?? p.id, p.family ?? 1, stageOf(p), label(p.parent)]) el("td", "", r, String(v ?? "")); });
    }
  } else {
    for (const fam of [...new Set(pets.map((p) => p.family ?? 1))].sort()) {
      el("h2", "fam", out, `Family ${fam}`);
      const g = el("div", "grid");
      for (const p of pets.filter((x) => (x.family ?? 1) === fam).sort((a, b) => (a.gen ?? 0) - (b.gen ?? 0) || (a.laid ?? 0) - (b.laid ?? 0))) {
        const f = el("figure", "", g), c = el("figcaption", "", f);
        f.prepend(sprite(p));
        el("b", "", c, p.label ?? p.name ?? p.id);
        el("span", "", c, [stageOf(p) + (p.stage === "dead" ? ", gone" : ""), p.parent ? `child of ${label(p.parent)}` : "", p.mutation ? `new ${p.mutation.slot}: ${p.mutation.to}` : ""].filter(Boolean).join(" · "));
      }
    }
  }
}
if (only !== "pets" && things.length) {
  el("h1", "", out, blind ? "What is each of these?" : "Things invented in this house").style.marginTop = "28px";
  const g = el("div", "grid");
  things.forEach((t, i) => {
    const f = el("figure", "", g), c = el("figcaption", "", f);
    f.prepend(big(composeThing(t), Z));
    el("b", "", c, `${blind ? `${i + 1}. ` : ""}${t.name}`);
    if (!blind) el("span", "", c, [t.does, t.by ? `by ${label(t.by)}` : ""].filter(Boolean).join(" · "));
  });
} else if (only === "things") el("p", "", out, "Nothing has been invented in this house yet.");
document.title = "Pet sheet: ready";
}
window.showSheet = showSheet;
try { showSheet(q.get("src") ? await (await fetch(q.get("src"))).json() : await house()); } catch (e) { el("p", "", out, `Nothing to show: ${e.message}`); throw e; }
</script>
</body>
</html>
