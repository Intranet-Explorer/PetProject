<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pet</title>
  <link rel="stylesheet" href="/src/style.css">
  <script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Pet</h1>
      <span id="family"></span>
    </div>
    <div id="status" class="chips"><span class="chip">connecting…</span></div>
    <label class="follow">Follow <select id="follow" aria-label="Follow"></select></label>
    <button id="replayBtn">Replay</button>
    <button id="themeBtn" aria-label="Switch between light and dark">Dark</button>
    <!-- Voice (§10.6) is ported after the view; its controls wait here, out of sight, until it is. -->
    <span class="sound" hidden>
      <span id="playing" role="status"></span>
      <button id="soundBtn" aria-pressed="false">Sound off</button>
      <input id="volume" type="range" min="0" max="100" value="60" aria-label="Volume">
    </span>
    <button id="drawerBtn" aria-expanded="false" aria-controls="drawer">Mind and lab</button>
  </header>
  <section id="replayBar" aria-label="Replay" hidden>
    <span class="chip on">Replay</span>
    <select id="replayLineage" aria-label="Family"></select>
    <button id="replayPlay" aria-pressed="false">Play</button>
    <input id="replayScrub" type="range" min="0" max="1000" value="0" aria-label="Where in the run">
    <span id="replayWhen"></span>
    <select id="replaySpeed" aria-label="Speed"></select>
    <button id="replayLive">Back to now</button>
  </section>
  <main>
    <div class="top">
      <div id="stage">
        <div id="room" aria-label="The room"></div>
        <p id="roomName"></p>
        <p id="banner" role="status" hidden></p>
        <div id="tip" hidden></div>
      </div>
      <aside id="side" aria-label="The house">
        <div id="sky"></div>
        <div id="map" role="group" aria-label="Rooms of the house"></div>
        <ul id="happening"></ul>
        <h2>Lately</h2>
        <ol id="moments" aria-label="Moments"></ol>
      </aside>
    </div>
    <ul id="cards" aria-label="Everyone in the house"></ul>
    <section id="controls" class="controls" aria-label="Visitor controls">
      <button id="feed">Feed</button>
      <button id="window">Open window</button>
      <span class="place">
        <select id="giveBit" aria-label="What to give"></select>
        <button id="giveBtn">Give</button>
      </span>
      <form id="talkForm">
        <input id="talkText" maxlength="200" placeholder="Say something" aria-label="Talk">
        <button>Say</button>
      </form>
      <span id="chosen" class="place" hidden>
        <span id="chosenWhat"></span>
        <button id="poke">Poke</button>
        <form id="nameForm"><input id="nameText" maxlength="16" placeholder="a name" aria-label="A name"><button>Name it</button></form>
        <button id="chosenDone" aria-label="Let go">×</button>
      </span>
    </section>
    <section id="ended" hidden>
      <p>The house is quiet. Nobody is left of this family; their stones and their things are still here.</p>
      <button id="newLineage">Start a new family</button>
    </section>
  </main>
  <aside id="drawer" hidden aria-label="Mind and lab">
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="mind">Mind</button>
      <button role="tab" data-tab="things">Things</button>
      <button role="tab" data-tab="family">Family</button>
      <button role="tab" data-tab="story">Story</button>
      <button role="tab" data-tab="lab">Lab</button>
      <button id="drawerClose" aria-label="Close">×</button>
    </div>
    <section class="panel" data-panel="mind"></section>
    <section class="panel" data-panel="things" hidden></section>
    <section class="panel" data-panel="family" hidden></section>
    <section class="panel" data-panel="story" hidden></section>
    <section class="panel" data-panel="lab" hidden></section>
  </aside>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
