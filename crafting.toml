# Making by discovery (SPEC-v3.4 §3). The pets are told none of this: they try a thing, are told what came of it,
# and what they found out is theirs to keep, teach and hand down. Tune here, not in code.
#
#   [process.<how>]    a way of changing a bit, and where in the house it can be done
#     at        where: room types, and/or fixtures by a key they have (`water`, `bench`, `sun`, a light that is on = `lit`),
#               or by name; `heavy = true`: beside something too heavy to move
#     pair      it takes two of the bit (two strands to weave)
#     tool      the kind of tool it must be carrying or have beside it
#     skill     how practised at making it must be (0 none, 1 some, 2 a good deal)
#     seconds   how long it takes once it is there
#     nothing   what it is told when the bit does not change that way
#   [material.<name>]  what a process can give: a bit like any other (carried, dropped, kept, made with)
#     can       the properties a thing made from it may have
#     like      the bit whose picture it borrows, with `tint` laid over it, until an asset pack draws its own
#   [[rule]]           bit + process -> material. `says`: what the pet is told. `spoils = true`: the bit is lost and
#               nothing comes of it. `hint`: what it is told to try next, if anything (never the answer).
#   [needs.<kind>]     the processed materials a kind of thing takes (all of them, carried or lying to hand)
#   [tool.<kind>]      a tool: what it is for, how many uses it lasts, what it is told without one
#   [[emerge]]         two properties that meet when two things are joined -> a property neither had
#   [grow.<what>]      what a planted seed becomes (§3.5)

# ---- processes ----

[process.soak]
at = { fixtures = ["water"] }
seconds = 8
nothing = "you held the {bit} in the water; it only got wet"

[process.warm]
at = { names = ["hot pipe"], fixtures = ["sun", "lit"] }
seconds = 10
nothing = "you held the {bit} in the warmth; it grew warm and that was all"

[process.melt]
at = { names = ["hot pipe"], fixtures = ["lit"] }
seconds = 10
nothing = "you held the {bit} to the heat; it would not melt"

[process.dry]
at = { rooms = ["attic"] }
seconds = 12
nothing = "you left the {bit} in the dry air a while; it is as it was"

[process.press]
at = { heavy = true, names = ["barrel", "flat stone", "rock", "trunk", "workbench"] }
seconds = 8
nothing = "you pressed the {bit} flat; it sprang back as it was"

[process.weave]
at = { fixtures = ["bench"] }
pair = true
seconds = 12
nothing = "you tried to weave the {bit}; it will not bend that way"

[process.carve]
at = { fixtures = ["bench"] }
tool = "carver"
seconds = 12
nothing = "you tried to carve the {bit}; it crumbled, or would not cut"

[process.grind]
at = { rooms = ["cellar"] }
seconds = 10
nothing = "you ground the {bit} on the cellar's stone floor; nothing came of it but dust"

