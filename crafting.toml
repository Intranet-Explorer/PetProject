# ---- the rules: mostly what one would guess, a few surprises, a few ways to spoil a thing ----

[[rule]]
bit = "reed"
how = "soak"
gives = "supple reed"
says = "the reed went soft and bendy in the water"
hint = "something this bendy might be woven"
[[rule]]
bit = "supple reed"
how = "weave"
gives = "wicker"
says = "the two wet reeds wove tight together and dried light and firm: wicker, that would hold things"
[[rule]]
bit = "reed"
how = "dry"
gives = "dry reed"
says = "the reed dried hollow and hard; it whistles when you blow across it"
[[rule]]
bit = "vine"
how = "soak"
gives = "supple reed"
says = "the vine went as soft and bendy in the water as a wet reed does"
[[rule]]
bit = "vine"
how = "dry"
gives = "vine cord"
says = "the vine dried into a tough brown cord"
[[rule]]
bit = "wax"
how = "melt"
gives = "clear wax"
says = "the wax ran clear in the heat and set again smooth and bright"
[[rule]]
bit = "wax"
how = "warm"
gives = "clear wax"
says = "the wax went soft and clear in the warmth"
[[rule]]
bit = "clay"
how = "warm"
gives = "fired clay"
says = "the clay baked hard in the heat: it rings when you tap it, and it would hold water"
[[rule]]
bit = "clay"
how = "press"
gives = "clay tile"
says = "the clay pressed out flat and even"
[[rule]]
bit = "clay"
how = "soak"
gives = "mud"
says = "the clay went to mud in the water"
[[rule]]
bit = "mud"
how = "dry"
gives = "mud brick"
