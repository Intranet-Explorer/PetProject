# ---- what a pet reads in the book can point at something to try (§4.1): a hint, never a recipe ----
# match: every one of these must be in the passage or its title ("a|b": either). bit, how: the thing it then wants to try.

[[hint]]
match = ["reed|rush|wicker|basket", "weav|woven|wet|water|soak"]
bit = "reed"
how = "soak"
[[hint]]
match = ["clay|pottery|ceramic|brick", "fire|kiln|heat|bak"]
bit = "clay"
how = "warm"
[[hint]]
match = ["wax|candle", "melt|heat|wick"]
bit = "wax"
how = "melt"
[[hint]]
match = ["rope|cord|twine|string", "twist|braid|strand|weav"]
bit = "string"
how = "weave"
[[hint]]
match = ["seed|plant|garden|farm", "grow|soil|sow|germinat"]
bit = "seed"
how = "plant"
[[hint]]
match = ["stone|flint|tool|knife|blade", "sharp|edge|cut|grind"]
bit = "pebble"
how = "grind"
[[hint]]
match = ["glass|sand", "melt|heat|furnace"]
bit = "pebble"
how = "grind"
[[hint]]
match = ["felt|wool|fibre|fiber", "press|mat"]
bit = "fluff"
how = "press"
[[hint]]
match = ["charcoal|wood", "burn|heat|fire"]
bit = "wood"
how = "warm"
[[hint]]
match = ["flour|grain|bread|meal", "grind|mill"]
bit = "seed"
how = "grind"
[[hint]]
match = ["amber|resin", "hard|fossil|dry"]
bit = "resin"
how = "dry"
[[hint]]
match = ["dye|colour|color|pigment", "flower|petal|plant|water"]
bit = "petal"
how = "soak"

[knowing]
inherited = 0.5           # how likely a child is to start out knowing each thing its parent knew
lift = 5.0                # the curiosity a thing found out is worth to the one who found it

# ---- kinds that take a processed material: getting one is what opens the kind (§3.1) ----

[needs]
basket = ["wicker"]
candle = ["clear wax"]
"plant pot" = ["fired clay"]
rope = ["rope"]
lantern = ["clear wax", "fired clay|glass|sharp stone|clay tile"]   # clear wax and something hard ("a|b": any one of these)
carver = ["sharp stone|fired clay"]
trowel = ["fired clay|carved wood"]
hammer = ["sharp stone|pebble|mud brick", "wood|carved wood", "rope|vine cord"]

# ---- tools (§3.4): things like any other, that wear with use and can be mended ----

[tool.carver]
does = "carve"
uses = 12
without = "you need something with an edge to carve this"
want = "make something that cuts"
[tool.trowel]
does = "plant"
uses = 16
without = "you need something to dig with to plant this"
want = "make something to dig with"
[tool.hammer]
does = "mend"
uses = 20
without = "you need something to knock it together with"
want = "make something to knock things together with"
builds = ["stool", "shelf", "chest"]   # with a hammer these are built bigger and sturdier

# ---- what comes of joining two things whose properties meet (§3.2) ----
# `a`, `b`: the two properties (either way round). `gives`: the new property, a table like those in materials.toml,
# so everything a property can do there it can do here. `says`: what the house tells the pet.

[[emerge]]
a = "bright"
b = "dark"
name = "glowing"
says = "it glows without being harsh"
gives = { need = "comfort", says = "a soft light: lit at night it costs no comfort, and none near it do", light = true, shade = true, gentle = true }
[[emerge]]
a = "soft"
b = "warm"
name = "snug"
says = "it is deep and warm to lie in: sleep comes easier in it"
gives = { need = "energy", says = "resting near it restores much more energy, and it is a comfort at night", rest_bonus = 2.0, near = { night = { comfort = 0.5 } }, use = { comfort = 4.0 }, by_size = true }
[[emerge]]
