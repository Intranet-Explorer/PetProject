# ---- growing food (§3.5): a seed planted with a trowel in a planting bed or a plant pot ----
# days: world days from planting to ripe when tended and watered; `gives`: what is picked, how many, and a seed back

[grow.seed]
days = 3
stages = ["planted", "sprout", "leaves", "ripe"]
gives = [["bean", 2], ["seed", 1]]
[grow."sprouting seed"]
days = 2
stages = ["planted", "sprout", "leaves", "ripe"]
gives = [["berry", 2], ["seed", 1]]
[grow.bean]
days = 3
stages = ["planted", "sprout", "leaves", "ripe"]
gives = [["bean", 3], ["fibre", 1]]

[growing]
water_hours = 12          # a plant watered (rain on it outdoors, water carried to it) within this long is growing well
untended = 0.5            # how fast one grows that is dry and untended
tended = 1.4              # ... and one watered and tended that day
wilt_days = 2             # dry this long it wilts, and a wilted plant gives nothing
cold = 0.5                # a cold night outdoors halves that night's growth
grown_lift = 3.0          # the comfort of eating what the family grew, on top of the meal
beds = ["bean row", "herb patch", "melon bed", "tomato vine", "berry bush"]   # fixtures a seed can be planted in, besides a plant pot
