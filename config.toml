# Pet v3 config (SPEC-v3 §11.5). Tunables for the engine; the house is in house.toml, the physics in materials.toml.

[clock]
tick_seconds = 2          # real seconds per engine tick; no model call on a tick
day_seconds = 7200        # real seconds per world day (the showcase used 900)
min_think_seconds = 70    # a pet thinks at most this often, scaled by how patient it is ...
urgent_seconds = 20       # ... unless something urgent happened: a low need, being spoken to, an event
max_idle_seconds = 180    # ... and at least this often
idle_think = 1.4          # SPEC-v3.5.4: with nothing new since its last thought, it waits this much longer than min_think_seconds
patient_spread = 0.4      # the most patient pet thinks this much less often than the least (§8.1)
elder_think = 1.25        # an elder thinks this much less often (§4.1)
walk_seconds = 90         # a step that cannot reach where it is going in this long happens where the pet stands
turbo = false             # SPEC-v3 amendment: world time does not follow the wall clock. While a model call is in
                          # flight the world waits; otherwise it runs straight on to the next thing due.

[steps]                   # real seconds each kind of step takes once the pet is in place; walking is one tile a tick
observe = 10
look = 8
move = 2
go = 4
speak = 8
rest = 40
use = 10
gather = 8
drop = 4
make = 14                 # SPEC-v3.3 §0: nothing decided keeps a pet on one spot past 30 watched seconds (was 16)
unmake = 8
arrange = 8
combine = 14
paint = 12
teach = 12
give = 6
show = 8
follow = 12
nuzzle = 8
accept = 4
take = 6
tell = 14
chase = 8
lay_egg = 14
bequeath = 12
write_belief = 10
revise_belief = 10
take_name = 4
put_away = 6              # SPEC-v3.3
process = 12              # SPEC-v3.4 §3: doing something to a bit, mending, carrying the book through a door
mend = 12
carry = 14                # (no step keeps a pet stood in one spot for more than 30 seconds of watching)
take_out = 4
hang = 8
write = 12                # SPEC-v3.1
scrub = 8
compose = 14
sing = 12
teach_song = 14
call = 4
name = 6
ask_book = 14

[model]
endpoint = "http://localhost:11434/v1"   # must be localhost
name = "pet-brain"        # qwen3.8:27b-mlx with a 16k context: ollama create pet-brain -f Modelfile
max_tokens = 700
timeout_seconds = 300     # long enough to wait its turn behind another house on the same model (a copy being measured)
parallel = 1              # model calls in flight at once; 2 only if Ollama runs with OLLAMA_NUM_PARALLEL=2 and it measures faster
night_tokens = 8000       # cap on a sleep call, thinking included
calls_per_hour = 150      # across all pets; routine thoughts slow down to stay under it, urgent ones never wait for it

[effects]                 # what the plain actions do; a pet is told none of the numbers
drift = { energy = -0.2, comfort = -0.35, curiosity = -0.7 }   # per 10 s, just from being awake; comfort's and curiosity's at half full, and in proportion elsewhere
                          # (SPEC-v3.5.4 §2: they were -0.1, flat, and -0.25: everything gave a little, and both sat at the top)
miserable = 0.4           # how much of the interest in a thing is left to a pet that is miserable
cozy = 0.35                # comfort per 10 s beside a bed, a blanket, a rug
restless = -0.3           # comfort per 10 s while bored, twice it while restless: staying put is not free
restless_to = 35          # ... and no lower than this by boredom alone
open_window = -0.5        # comfort per 10 s at night in a room with the window open
yours = 0.1               # comfort per 10 s beside a thing of its own that it has kept a world day (§3.3)
rest_per_10s = 2.0        # energy while resting; a bed or bench has its own figure in house.toml
observe = { curiosity = 0.2 }
look = { curiosity = 0.4 }
speak = { energy = -0.5 }
gather = { energy = -0.5 }
eat = { energy = 12.0, comfort = 1.0 }
ripe = { energy = 9.0, comfort = 3.0 }    # a ripe plant from the garden or greenhouse
double_feed_seconds = 300 # a second meal this soon after the last gives discomfort in place of energy
new_room = 8.0            # curiosity the first time it walks into a room
show = { curiosity = 2.0, company = 1.0 }   # to the one shown; the one showing gets the company
said_to = 2.0             # company from speaking to another pet, or telling
gift = 3.0                # company for both when a gift is taken
paint = { energy = -2.0 }
play = { energy = -0.5 }  # a toy takes a little energy
nuzzle = { company = 8.0, comfort = 2.0 }
spoken_to = 3.0           # company from being spoken to by another pet
visitor_talk = 4.0        # company from the visitor talking
feed_creature = { company = 2.0, curiosity = 1.5 }
chase = { energy = -2.0, curiosity = 2.0 }
# company per 10 s (§7.4). It settles toward what the company at hand gives: with another pet in the room it rises
# (`near` beside them, `room` otherwise) as far as `presence_to`; with a creature it has fed, `friend` as far as
# `friend_to`; with any creature, `creature` as far as `creature_to`; the visitor looking in counts as presence.
# Above that it slips, times 0.5 + how sociable the pet is: past `presence_to` at `together` (the rate halfway from
# there to full, twice it when full) wherever the pet is, and below it at `alone` (the rate halfway between
# `alone_to` and `presence_to`), down to `alone_to` with nobody about.
company = { near = 0.15, room = 0.05, creature = 0.03, friend = 0.1, visitor = 0.05, presence_to = 65, together = -0.3, alone = -0.1, alone_to = 25, friend_to = 55, creature_to = 45 }
stone = { company = 3.0, comfort = 1.0 }   # touching the stone of one of its own
offer_seconds = 300       # an offer nobody takes lapses after this
reply_seconds = 1500      # speech answered within this counts as a reply (Lab): about twenty thoughts
write = { curiosity = 1.5 }             # v3.1: scratching words on a wall
new_song = 3.0            # curiosity from hearing a song it does not know
lullaby = 2.0             # comfort for an egg or a sleeping child sung to
read = { curiosity = 4.0 }               # reading a passage in the book
tame_died = { comfort = -6.0 }           # its animal has died
nuzzle_again_hours = 8    # SPEC-v3.2 §9: two that have leaned together do not lean again for this many world hours
nuzzle_wear = 0.7         # each nuzzle with the same one is worth this much of the last, until a night eases it

[novelty]                 # familiarity (SPEC-v2 §4): doing a thing again is worth less each time
max = 2.0                 # curiosity for doing something not done for a while ...
new_hours = 36            # ... in full once it has not done it for this many world hours, or ever (SPEC-v3.5.4 §2: it was a point every 300 s)
fresh_seconds = 600       # a made thing gives its full curiosity only if left alone this long
wear = 0.6                # each repeat is worth this much of the last (a curious pet tires of things faster) ...
floor = 0.03              # ... down to this (SPEC-v3.5.4 §2: was 0.75 and 0.1; what it has handled many times gives almost nothing)
cap = 10                  # repeats stop counting here
per_kind = 4              # SPEC-v3.5.4 §2: handling this many things of one kind wears it like one repeat of the same thing
eases = 2                 # repeats forgotten each night
familiar = 4              # from this many repeats it is told the thing has grown familiar

[feel]                    # where a need turns from one word to the next (§3.1), and how temperament moves that
steps = [80, 60, 40, 20]  # below these a need is one word worse
gene_shift = 24           # a gene at 1.0 feels each step this many points sooner than one at 0.0 (sensitive, curious, sociable)
trend = 0.8               # per 10 s: faster than this and it is "getting worse" or "getting better"

[packet]
max_chars = 9000          # about 2,500 tokens; what is cut first is in mind.py and DECISIONS.md

[life]                    # SPEC-v3 §4. Days are world days.
egg_minutes = 10          # real minutes as an egg
lifespan_days = 24        # before wellbeing and hardiness adjust it by up to 30%
adult_days = 6            # days as an Adult before Elder
wellbeing_share = 0.3     # how much of a lifespan a life well or badly lived can add or take (§4.1) ...
wellbeing_span = 30       # ... reached this many points of lifelong wellbeing above or below 50
hardy_share = 0.2         # the spread of lifespan between the least and the most hardy
egg_energy = 25.0         # what laying an egg takes
neglect_days = 1          # this long with comfort and energy low (waking time; good time pays it back): it weakens
neglect_below = 20        # "low": the mean of comfort and energy under this
awake_share = 0.7         # the part of a world day a pet is awake, for turning days into waking ticks
neglect_cost_days = 2     # lifespan lost per further day of it
fade_minutes = 3          # real minutes a dead pet lies still before its stone is all that is left
population = 4            # pets and eggs alive at once
auto_lineage = false      # start a new lineage by itself when the last pet dies (headless runs); the view offers it otherwise
temper_sigma = 0.09       # how far each gene of temperament moves from parent to child (standard deviation) ...
temper_jump = 0.45        # ... and the chance that one gene moves a good deal further (§5.4)
egg_pull_days = 3         # an Adult with no egg feels the pull to lay one after this many Adult days

[growth]                  # SPEC-v3 §4.1 as amended: stages are paced by days lived, nothing else
child = 2                 # the day of its life on which it becomes each stage
youngling = 4
adult = 7
useful_uses = 5           # a made thing is "useful" once used this often, most times raising the need it is for
useful_wellbeing = 3.0    # each useful thing it made counts as this many points of lifelong wellbeing ...
useful_max = 5            # ... for up to this many things: about half the 30% a good life can add to a lifespan
taught_max = 4

[make]
carry = 3                 # bits a pet can carry
same = 2                  # after this many of one kind in one material ...
same_days = 3             # ... within this many world days, that pair is not offered to it again (13 October 2026); everything else stays open
effort = 2.0              # energy to make a thing, plus one per part; combining costs effort + 1 (halved at a workbench)
tired = 8                 # too tired to make anything below this much energy
loose_bits = 12           # dropped bits a room's floor holds before the oldest is swept away
crowded = 10              # made things on one room's floor before it feels cluttered (SPEC-v3.5.4 §1: no longer a bar to making) ...
clutter_days = 1          # ... and its things nobody has used this long can go: to the machine, or a keepsake box
parts = { hatchling = 2, child = 3, youngling = 3, adult = 3, elder = 3 }   # a made thing's parts; combining goes to 6

[sleep]
hour = 23
wake_hour = 6
energy_below = 30
restore_per_10s = 0.4     # energy while asleep. In real seconds like every other rate: a short day drains less and restores less
comfort_per_10s = 0.15    # comfort while asleep in the dark, up to ...
comfort_cap = 60          # ... this, or
cozy_cap = 75             # ... this when it sleeps by a bed or a blanket. With a light on it gains nothing and wakes saying so.
think = "medium"          # reasoning effort for the night's work; the showcase used "low" to fit a short night

[beliefs]
max_active = 16           # at the cap it has to revise or discard

[marks]
window_patch_seconds = 10000

[senses]
enabled = true

[lab]
window = 50
exploit_need_below = 50

[stub]                    # the scripted brain used for headless runs (§11.3); never used with the real lineage
enabled = false

[visitor]
surprises = false         # let the director drop a gift in the visitor's name now and then (§6.5)

[weather]
real = true               # §6.6: fetch the Twin Cities' current weather once an hour from one fixed host (on since 11 October 2026; the turbo and test profiles turn it off)
real_url = "https://api.open-meteo.com/v1/forecast?latitude=44.98&longitude=-93.27&current=temperature_2m,precipitation,weather_code,cloud_cover&hourly=weather_code,temperature_2m&forecast_hours=3"   # (SPEC-v3.5.1 §2: and two hours on, which is the house's tomorrow, for the lit sign)

[season]                  # SPEC-v3.5 §5: seasons follow the world clock (house.toml, seasons.toml)
force = ""                # for a test: a season's name holds the whole house in that season, whatever the clock says

[replay]                  # what the view was shown, kept so a run can be played back (a turbo run is replayed, not watched)
every_ticks = 5
keep_days = 60

[server]
host = "127.0.0.1"
port = 8000
origins = ["http://localhost:8000", "http://127.0.0.1:8000", "http://localhost:5173", "http://localhost:8001", "http://localhost:8002",
           "http://localhost:8003", "http://localhost:8004", "http://localhost:8005", "http://localhost:8006"]

# ---- SPEC-v3.1: things the family can discover ----

[arrivals]                # §1: world days after v3.1 came to this house. Each comes once, when a pet is awake to meet it.
writing = 0
songs = 2
taming = 3
radio = 5
book = 7
strangers = 10
strangers_generations = 3 # ... and not before the family has had this many generations
force = false             # §9.2, for the check on a copy: each arrival a twentieth of a world day after the one before

[writing]                 # §2
max_chars = 80
cap = 6                   # inscriptions a room holds; at the cap a new one wears away the most faded
shown = 3                 # how many a pet is shown at once
chalk_writings = 3        # a piece of chalk is used up after this many
chalk_days = 12           # world days until chalk has faded away ...
scratch_days = 5          # ... and a scratch made with a hard bit
damp = 2.0                # how many times faster in the cellar
faded = 0.5               # past this share of its time it reads as faded

[songs]                   # §3
ear_drift = 0.15          # learned by ear, the chance that each note shifts one step
repertoire = 8            # songs a pet holds; past it the least sung is forgotten
min_notes = 3
max_notes = 12

[taming]                  # §4. Trust is a creature's, per pet, and hidden.
tame_at = 6.0             # at this much it is that pet's animal; below half of it, no longer
fed = 2.0                 # for a bit it likes
still_per_minute = 0.15   # for a pet staying still within three tiles
follow_per_minute = 0.3   # for a pet keeping close to it
chased = -3.0
noise = -1.0              # something loud used in its room
rush_per_minute = -0.3    # a pet moving with a spring in its step close by
creatures = 3             # in the house at once from then on, of which one wild one of each kind
lifespan_days = { mouse = 40, beetle = 32, moth = 26, bird = 48 }   # longer than a pet's
young_at = 0.4            # the share of its life at which a tame creature has young, once

[radio]                   # §5; SPEC-v3.5.1 §5: a real station. The page plays its stream; the engine asks what song is on. A pet fetches nothing.
fetch_seconds = 60        # what song is on, at most this often, and only while the radio is on
max_chars = 200
keep = 3                  # the songs a pet in the room still has in its head
allow = ["api.radioparadise.com"]   # the only host the engine asks (the page itself plays the stream from stream.radioparadise.com)
blocklist = []            # words Tyler does not want in the house: a song's name with one of them is not told
now_url = "https://api.radioparadise.com/api/now_playing?chan={chan}"
stations = [              # Radio Paradise's four mixes, mellow to lively (listener-supported, no ads); chosen 13 October 2026, see DECISIONS
  { id = "serenity", name = "Serenity", chan = 42, mood = "mysterious", sound = "slow and dreamy", stream = "https://stream.radioparadise.com/serenity", home = "https://radioparadise.com" },
  { id = "mellow", name = "Mellow Mix", chan = 1, mood = "calm", sound = "soft and easy", stream = "https://stream.radioparadise.com/mellow-128", home = "https://radioparadise.com" },
  { id = "main", name = "Main Mix", chan = 0, mood = "lively", sound = "with a bit of everything in it", stream = "https://stream.radioparadise.com/aac-128", home = "https://radioparadise.com" },
  { id = "rock", name = "Rock Mix", chan = 2, mood = "lively", sound = "loud and driving", stream = "https://stream.radioparadise.com/rock-128", home = "https://radioparadise.com" },
]

[book]                    # §6. An offline copy of Simple English Wikipedia; nothing leaves the Mac when a pet asks.
zim = "book/wikipedia_en-simple_all_maxi_2026-09.zim"
chars = 400               # about how much of an article a pet reads
max_question = 80
per_hours = 1             # each pet at most once a world hour
terminal_hours = 0.25     # SPEC-v3.5.1 §3: at one of the machine room's screens, once a quarter hour
keep = 2                  # the passages a pet still has in its head

[strangers]               # §7
population = 5            # pets and eggs alive at once, once a second family is in the house ...
per_family = 3            # ... and at most this many of one family
familiar_hours = 8        # world hours awake in the same room before a stranger is someone it knows
nuzzle = 0.4              # how much of a nuzzle's ease there is with a stranger

# ---- SPEC-v3.3: alive ----

[body]                    # §1: what a pet does by itself between thoughts (the activities are in activities.toml)
on = true
focus = 1.6               # how strongly what its mind wants to be about weights the activities that serve it
habit = 0.8               # how much a settled habit adds ...
habit_full = 10           # ... once it has done that there at that hour this many times
habit_shown = 4           # a habit is shown on its card from this many
habit_watched = 0.3       # what a young one picks up each time it watches a parent do something
variety = 0.7             # each time an activity is among the last eight it scores this much lower ...
fresh = 2.0               # ... and one it has not done for a while scores up to this much higher,
fresh_seconds = 120       # in full after this long (so a focus narrows what it does without making it do only that)
again = 1.5               # ... and this much lower if it was the very last thing
stay = 2.5                # doing a second thing on the spot it has just done one on scores this much lower: it moves about
leash = 2.0               # with its mind on being near something or someone, a thing to do further off than 3 tiles scores this much lower
chance = 0.6              # a little randomness, so two alike do not move in step
passive = 14.0            # resting, looking and watching are pushed down as their share of its recent time ...
passive_share = 0.10      # ... rises past this (a worn-out pet is let off some of it)
passive_max = 0.18        # ... and past this share none of them is done at all
window_ticks = 150        # the recent time that share is taken over
walk_seconds = 30         # it gives up walking to where an activity is after this long, and does it where it stands
go_again_seconds = 180    # it does not leave a room by itself sooner than this after coming in, without a reason
stay_seconds = 120        # SPEC-v3.5.4 §3: nor, for any reason of its body's, sooner than this (4 real minutes); its mind may send it any time
back_seconds = 300        # ... and not back into the room it has just left for this long (10 real minutes), unless someone it is with, the visitor or an event calls it there
stale_hours = 4           # a room it has not been in for this many world hours draws it ...
stale = 1.5               # ... this much (twice that when it is bored)
fidget = 0.3              # v3.4 §1: after an activity, this often a fidget (a stretch, a hum: one tick, on the spot) comes before the next; twice as often while a thought is on its way
handle = 3.0              # what a thing it has not handled lately adds while it has handled fewer than three different things in the last handle_ticks ...
handle_ticks = 50         # ... (three and a half minutes of watching), in full when it has handled one or none
try_after_seconds = 40    # v3.4 §3.1: with a bit carried to where it can be tried, this long is left for its mind to take it up before its paws try it themselves
want = 5.0                # SPEC-v3.4 §2.1: what serving one of its wants adds (a bit it wants to hold, a door it wants to try, the way to where it can try something)
stride = 2.0              # what a thing at the far side of the room adds when it has walked fewer than stride_tiles in the last handle_ticks
stride_tiles = 12
together = 1.5            # what doing the same thing as the one its mind is on being with adds (a third of it with any kin who is at it)
seats = ["cushion", "rug", "blanket", "nest", "bed-mat", "stool"]   # the kinds of made thing (and the fixtures by these names) a body settles on, besides whatever the house has to rest on or that is soft
mess_pull = 0.6           # what each step of a room's mess adds to tidying (times 0.4 to 1.6 by how orderly it is)
make_bits = 2             # with its mind on making, it gathers this many bits (if there are that many) before it lays them out
make_pull = 8.0           # how strongly each step of getting ready to make pulls, once its mind is on making
tend_grow = 0.01          # what tending adds to a plant's growth
sing_again_seconds = 600  # it does not sing by itself more often than this

[signs]                   # §5.4: the sign over a pet's head while it carries out a step it decided (sprite icon.act.<name>)
look = "eye"
go = "door"
speak = "speech"
tell = "speech"
show = "speech"
use = "paws"
gather = "paws"
drop = "paws"
make = "paws"
unmake = "paws"
combine = "paws"
arrange = "broom"
put_away = "broom"
process = "paws"
mend = "hammer"
carry = "book"
take_out = "paws"
hang = "broom"
paint = "paws"
teach = "paws"
give = "heart"
nuzzle = "heart"
accept = "heart"
take = "paws"
chase = "walk"
lay_egg = "heart"
bequeath = "heart"
write_belief = "eye"
revise_belief = "eye"
write = "paws"
scrub = "broom"
compose = "note"
sing = "note"
teach_song = "note"
call = "speech"
name = "speech"
ask_book = "book"
take_name = "speech"
rest = "zzz"
observe = "eye"

[order]                   # §2
tidy_below = 2            # this many loose things or fewer: "everything here has its place"
mess_above = 6            # more than this: "this room is a mess"
old_days = 5              # a thing someone who has died left lying about, untouched this long, goes into its keepsake box (order.keep)
restore_from = "data.backup-v3.3-2026-10-12-before-tidy"   # the copy of the house (a folder beside its data) that what wore out on 12 October is put back from, once (tick.unwear)
bits = 12                 # loose bits a shelf, chest or basket takes beside the things it holds: a whole floor's worth (make.loose_bits)
pawful = 3                # loose bits a pet puts away at one go
just_out_seconds = 300    # a thing taken out, brought to someone or rolled across the room is left where it is this long before anybody's body tidies it away again
mess = -0.15              # comfort per 10 s in a mess, for a pet as orderly as can be (none below the middle)
tidy = 0.05               # ... and in a tidy room

[process_signs]           # SPEC-v3.4 §3.1: the sign for each way of changing a bit, over a pet that is trying it (a decided step, or its body by itself)
soak = "drop"
warm = "flame"
melt = "flame"
dry = "dry"
press = "press"
weave = "weave"
carve = "edge"
grind = "grind"
plant = "sprout"

[skills]                  # SPEC-v3.4 §2.2: practice, felt in words, never shown as a number
steps = [3, 10, 25]       # how many times it has done a thing before it is some, a good deal, and very practised
watched = 0.3             # what a young one picks up each time it watches a practised parent do it

[wants]                   # SPEC-v3.4 §2.1
most = 3                  # wants a pet holds at once
every_ticks = 5           # how often each pet's wants are looked over
fade_days = 1             # a want left alone this long fades
again_days = 3            # ... and the same one does not come back sooner than this
lift = { comfort = 4.0, curiosity = 5.0 }   # what a want fulfilled is worth
cold_rooms = ["cellar", "attic"]            # where a pet at night wants something warm
uneasy_below = 35         # comfort below which kin wants bringing something

[invent]                  # SPEC-v3.5 §3
per_day = 20              # new kinds a house can invent in a world day (§3.4)
want = 1.6                # how much a pet with two things it could join into something nobody has made wants to find out what would come of it

[music]                   # §3.1: the visitor's music, per 10 s to whoever hears it; never said as a number
calm = { comfort = 0.15 }
lively = { curiosity = 0.2 }
mysterious = { curiosity = 0.1 }
sad = { comfort = 0.05 }
learn_minutes = 6         # world minutes of hearing a tune before a pet has it by ear, like any song
tunes = { calm = ["mi long", "so long", "mi long", "re long", "do long"], lively = ["do short", "mi short", "so short", "high do short", "so short", "mi short", "so long"], mysterious = ["low la long", "do short", "low la short", "mi long", "re short", "low la long"], sad = ["la long", "so long", "mi long", "re short", "mi long"] }

# ---- SPEC-v3.5.4: drive ----

[drive]                   # what a pet can be proud of (engine/feats.py). Never said as a number.
glow_hours = 4            # world hours a glow of pride takes to fade (§12)
glow_curiosity = 3.0      # curiosity a glow lifts, per size (pleased 1, proud 2, very proud 3)
keep_feats = 200          # feats the house keeps for the board and the packet
board_rows = 4            # SPEC-v3.5.4 §11: feats the board shows at once, beside the Works (one line to a pet)
board_hours = 1           # world hours between turns of the board (it turns at once for a new feat)
board_days = 3            # world days a feat can be on the board, and a pet's turns up there are remembered
board_named = 6           # each turn a pet has had on the board lately puts its next this many world hours back
board_young = 3           # ... and a young one's comes this many world hours sooner (less than a turn: it is favoured, not always up)
# §6 firsts (engine/firsts.py): judged by what was done, never by a name
first_glow = { own = 1, family = 2, house = 3 }   # pride for its own first, its family's first, the house's first
first_fade = 0.6          # each further first in the same world day is worth this much of the one before
first_least = 0.5         # a first worth less than this gives no pride (and its own is not a moment)
recent_days = 2           # world days the packet says the family's and the house's newest firsts
# §7 bests
best_own_glow = 1         # beating its own best (equalling it is nothing)
