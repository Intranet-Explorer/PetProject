# Pet config (SPEC v1 §18, SPEC-v2 §12). The one place for tunables.

[clock]
tick_seconds = 2          # real seconds per engine tick; no model call on a tick
day_seconds = 1800        # real seconds per world day. 1800 is the fast clock for the V2.3 check; 7200 is the real one
min_think_seconds = 70    # it thinks at most this often (51 an hour) ...
urgent_seconds = 20       # ... unless a visitor acts, a need falls under 30, or it just woke or hatched
max_idle_seconds = 180    # ... and at least this often (20 an hour), so it never freezes

[steps]                   # real seconds each kind of step takes once the pet is in place; walking is one tile a tick
observe = 12
look = 8
move = 2
speak = 8
rest = 40
use = 10
arrange = 8
write_belief = 10
revise_belief = 10
make = 16
unmake = 8
combine = 16
paint = 12
teach = 12

[world]
start_stage = "egg"       # set to "hatchling" to skip the egg while debugging

[make]
item_cap = 12             # made things in the room at once
energy_base = 4           # making costs this ...
energy_per_part = 2       # ... plus this per part
unmake_refund = 3         # energy back for taking one apart

[senses]
enabled = true            # the packet says what the pet can feel right now, but never why (see README)

[growth]                  # SPEC-v2 §6: stages are earned by what it has made and lived through, checked each morning
useful_uses = 5           # a thing is useful once it has helped its need on most of at least this many occasions
child = { days = 2, useful = 2 }
youngling = { days = 4, useful = 5 }
adult = { days = 8, useful = 8, kept_beliefs = 3, kept_days = 2 }   # ... and 3 beliefs it has held for 2 days or more
taught_max = 4            # things that can have a behavior at once (§7)

[egg]
egg_minutes = 10          # real minutes as an egg; the model is not called

[sleep]
hour = 23                 # asleep from this world hour, or earlier in the night if energy is low
wake_hour = 6
energy_below = 30
restore_per_10s = 0.4     # energy regained while asleep

[marks]
window_patch_seconds = 10000   # waking time near the window before the faded patch appears

[lab]                     # measured for the Lab tab; nothing here drives growth any more
window = 50               # hidden-rule predictions in the rolling accuracy
exploit_need_below = 50   # the related need must be under this for a rule to count as used on purpose

[twin]                    # the scripted baseline from v1: code kept, off by default
enabled = false
explore = 0.15
belief_min_obs = 10

[model]                   # picked in M0 (m0/results/summary.json)
endpoint = "http://localhost:11434/v1"   # must be localhost
name = "pet-brain"        # qwen3.8:27b-mlx with a 16k context, 18 GB instead of 28: ollama create pet-brain -f Modelfile
temperature = 0.7
max_tokens = 600
timeout_seconds = 60

[server]
host = "127.0.0.1"
port = 8000
origins = ["http://localhost:8000", "http://127.0.0.1:8000", "http://localhost:5173"]
