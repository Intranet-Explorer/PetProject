# Pet v1 config (SPEC §18). The one place for tunables.

[clock]
tick_seconds = 10      # real seconds per tick
day_seconds = 7200     # real seconds per world day

[world]
start_stage = "egg"    # set to "hatchling" or "child" to skip ahead while debugging

[growth]               # SPEC §10. Tune after watching the first run.
egg_days = 1           # hatches on waking after this many world days
window = 50            # rule-tagged predictions looked at
accuracy = 60          # % of them that must be correct for Child
rules_exploited = 2    # of the 3 hidden rules
exploit_times = 5      # times a rule must be exploited, counted over the whole life
exploit_need_below = 50   # the related need must be under this for an exploit to count
window_patch_ticks = 1000 # waking ticks near the window before the faded patch appears

[twin]
explore = 0.15         # chance of a random action
belief_min_obs = 10    # observations before it writes a templated belief

[model]                # picked in M0 (m0/results/summary.json)
endpoint = "http://localhost:11434/v1"   # must be localhost
name = "qwen3.8:27b-mlx"
temperature = 0.7
max_tokens = 400       # caps a turn at roughly 12 s on the M3 Max
timeout_seconds = 60

[server]
host = "127.0.0.1"
port = 8000
origins = ["http://localhost:8000", "http://127.0.0.1:8000", "http://localhost:5173"]

[sleep]
hour = 23              # asleep from this world hour, or earlier in the night if energy is low
wake_hour = 6
energy_below = 30
restore_per_tick = 0.4 # energy regained per sleeping tick
