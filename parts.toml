# ---- materials (SPEC-v5.1 §2): every bit of house.toml and every material of crafting.toml, with its tier
# (contracts.TIERS), its source (contracts.SOURCES; `from` and `at` for a worked one: the bit and the process), its
# class (contracts.MAT_CLASSES) and its quality 0.5-1.0 (a part's strength is scaled by it). This phase changes no
# stock: the tier-3 and tier-4 materials are here so the grammar can name them and refuse them. ----
