# ---- the grammar as the model is told it (SPEC-v5.1 §4.1): one plain line each, in order. A line is shown when its
# first part is of a tier the hob may make (its tier + 1); contracts.grammar puts them together. Every part with
# verbs is named by a line (check_contracts). ----
[[line]]
parts = ["stick"]
says = "A stick knocks things and digs a little."
[[line]]
parts = ["box", "jar", "bowl", "basket", "bucket", "lid"]
says = "A box, a jar, a bowl, a basket or a bucket holds things; a box with a lid keeps the mouse out."
[[line]]
parts = ["bottle", "plate", "ring"]
says = "A bottle holds water; a plate or a ring holds a little."
[[line]]
parts = ["lip", "spout", "handle"]
says = "A vessel with a lip or a spout pours; a lip on a handle is a spoon."
[[line]]
parts = ["basket", "bucket", "rope", "strap", "sling"]
says = "A basket, a bucket, rope, a strap or a sling carries a load; a sling with a stone in it throws it."
[[line]]
parts = ["frame", "cloth", "sail", "weave"]
says = "A frame holds things on it; with a cloth, a sail or a weave over it, it keeps the rain off."
[[line]]
parts = ["cushion", "pad", "cloth", "weave", "block"]
says = "A cushion, a pad, a cloth or a weave covers and keeps a hob warm; a pad on a block is a bed, and a block is a seat."
[[line]]
parts = ["flame", "shade", "lens", "mirror"]
says = "A flame heats a little; under glass, a shade, a lens or a mirror it lights a room."
[[line]]
parts = ["wick", "pole"]
says = "A wick burns small: a candle, or a torch on a pole."
[[line]]
parts = ["blade", "handle"]
says = "A blade cuts; on a handle it also strikes and digs a little."
[[line]]
parts = ["head", "handle"]
says = "A heavy head on a handle strikes: it drives a nail and sets a patch."
[[line]]
parts = ["scoop", "spade", "tines", "handle"]
says = "A scoop, a spade or tines on a handle dig."
[[line]]
parts = ["bristles", "handle"]
says = "Bristles on a handle sweep up the small bits."
[[line]]
parts = ["net", "cage", "hook", "string", "pole"]
says = "A net or a cage catches; so does a hook on a string or a pole."
[[line]]
parts = ["hook", "plate"]
says = "A hook on a plate hangs things on a wall."
[[line]]
parts = ["needle", "patch"]
says = "A needle mends soft things; a patch mends a leak or a tear and is used up."
[[line]]
parts = ["cord", "rope", "strap"]
says = "Cord, rope or a strap binds two things into one."
[[line]]
parts = ["tube", "spring", "string"]
says = "A tube throws what fits in it (pebbles, seeds, nuts, darts) if a spring or a drawn string is behind it; alone it holds a little and pours."
[[line]]
parts = ["seeds", "bowl"]
says = "Seeds in a pot, a jar or a box grow."
[[line]]
parts = ["horn", "drum skin", "strings", "chimes"]
says = "A horn, a drum skin, strings or chimes are heard in the next room."
[[line]]
parts = ["bell dome", "bell"]
says = "A bell is heard in the next room."
[[line]]
parts = ["wheel", "axle"]
says = "A wheel carries a load; on an axle it moves."
[[line]]
parts = ["gear", "spring", "pulley", "lever"]
says = "A gear or a wound spring turns a wheel; a pulley with a rope over it lifts; a lever on a block shifts what a paw can't."
[[line]]
parts = ["spring", "tube"]
says = "A spring is strong: a reed tube won't take one, but wood, clay or metal will."
[[line]]
parts = ["key"]
says = "A key opens a locked door or the gate."
[[line]]
parts = ["hinge", "pin", "feather"]
says = "A hinge lets a lid swing; a pin holds two parts together; a pin with a feather is a dart."
[[line]]
parts = ["valve", "casing", "dial"]
says = "A valve on a tube lets water through or stops it. A casing keeps a thing from wearing: it wears half as fast. A dial shows how much."
[[line]]
parts = ["bellows", "wire"]
says = "Bellows blow a fire hotter. Wire binds."
[[line]]
parts = ["boiler", "piston"]
says = "A boiler over a flame holds its heat; a piston on a boiler moves things by itself."
[[line]]
parts = ["bulb", "wire", "cell", "coil", "switch"]
says = "A bulb with a wire and a cell lights a room with no fire; a coil on a cell buzzes; a switch turns them on and off."
[[line]]
parts = ["flower", "gem", "band", "studs", "disc", "bundle"]
says = "Flowers, gems, bands and studs are for looking at; a disc is a sign or a top; a bundle burns, or is a doll's body."
