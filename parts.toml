# SPEC-v5.1 §1-§2: the grammar's data. A thing is its parts; each part gives verbs (contracts.VERBS) at a strength,
# some only when another part is on the same thing (`needs`: verb -> alternatives, any one will do; an alternative
# is a part's name, a material's name or class, or "charge"; a list inside the list means all of them together).
# A verb's strength on a thing is the part's strength x its material's quality; a thing's verb is the strongest of
# its parts'. A thing's tier is the highest of its parts', each the lower of its own tier and its material's (21
# October 2026: a wooden hinge is no mechanism). Written by the lead, 21 October 2026;
# the parser (engine/grammar.py) reads it and nothing else does the grammar's work.
#
# `materials`: names or classes it can be made of (contracts.MAT_CLASSES). `role`: base | on | wrap, for the
# compositor. `icon`: the PixelLab cell (assets-incoming/pixellab/cells/<icon>.png) for the recipe card. `draw`: the
# view's part (view/assets/parts.json) the compositor uses, when it isn't the same name. `wear`: how fast the thing
# wears (a casing halves it). `with`: {another part: the materials it must be of when both are on a thing} (a spring
# and a reed tube). `words`: the part's line of the grammar, as the model is told it. A part with no verbs
# says in its words what it is for on a thing (a shade, a handle, a lid).
#
# The thirty lines of SPEC-v5.1 §1 are these parts' needs: a tube throws only with a spring, a string or a charge; a
# blade strikes and digs only on a handle; a vessel pours only with a spout or a lip; a frame covers only with a
# cloth, a sail or a weave; a flame lights only under glass, a shade or a lens; a wheel moves only on an axle; a bulb
# lights only with a wire and a cell; a bell, a horn, a drum skin or chimes signal; a net, a cage or a hook on a
# string catches; a scoop or a spade on a handle digs; a head on a handle strikes; cord, rope, a strap or wire binds.

