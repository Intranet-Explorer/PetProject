# The vending machine (SPEC-v3.5 §4.3): a fixture of the storeroom (house.toml) that hands out base materials and takes
# made things and bits back. What the materials are, and what can be done to them, is in crafting.toml. Tune here.

[machine]
materials = ["wood", "stone", "metal", "clay", "fibre", "sand"]   # what it holds, in the order its slots show them
limit = 12                # of each, at most
start = 12                # of each, when a house first has one
restock = 2               # of each, by the delivery every morning
free = 2                  # what it gives each pet in a world day
bits = 3                  # bits fed for one material back (a made thing is one for one)
lit_seconds = 8           # how long its lights stay up after it gives, takes or is stocked
short = 3                 # with fewer than this many of a material lying about in the rooms a pet knows, the machine is where it goes for it
spare_days = 2            # a thing of its own lying about that nobody has touched this long is spare: something to feed to the machine
spare_kind = 3            # ... and so is one where a room has this many of the kind (its third nest) ...
spare_kind_days = 0.5     # ... once it has lain untouched this long: nothing just made is spare
stored_days = 5           # a thing of its own put away on or in something, untouched this long, is spare too: one such a day from each pet
stored_weight = 0.6       # ... wanted fed this much less than one that lies about
feed_weight = 2.0         # how much a spare thing is wanted fed (the orderly lean toward it, like any want of theirs)
clutter_weight = 2.0      # ... times this for an old thing in a cluttered room (SPEC-v3.5.4 §1)
scrap_weight = 1.5        # ... times this for scrap: an old charm past the few it keeps, or a thing nobody uses (SPEC-v3.5.8 §4)
spring_weight = 2.0       # ... and this, for the world days of the spring clean
scrap_back = 3            # scrap fed for one base material back to whoever fed it (SPEC-v3.5.8 §4.1)
bits_weight = 0.8         # ... and three loose bits lying about in some other room than the machine's, beside a spare thing
peek_weight = 1.2         # how much a pet with little in its paws to make anything of wants to see what the machine has

# What a fed thing is like decides what the machine offers for it (a thing that came of two natures meeting offers
# for both; three bits, for everything any of them could be). `other`: anything else.
[returns]
soft = ["fibre"]
springy = ["fibre"]
hard = ["wood", "stone"]
heavy = ["stone"]
noisy = ["metal"]
other = ["clay", "sand"]

[steps]                   # like config.toml [steps]: seconds at the machine once the pet is there
machine_take = 6
machine_feed = 8

[signs]                   # like config.toml [signs]
machine_take = "paws"
machine_feed = "box"
