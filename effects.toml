# Designing (SPEC-v3.6d): what a grown hob's design can do, what each part can be made of, and how a design is built.
# SPEC-v5.1 §4.5 deleted designing: what is read now is [effect] (what the old working designs do: design.as_kind) and
# [tune]'s show_minutes and cost (the catalog's buying back); the rest is the record of how it was.
# engine/design.py reads it; no model is asked anything here. Hobs may imagine anything, but the house answers only to
# the effects below: for each effect a design claims, the engine looks for a part (and the stuff it is made of) that
# provides it. Tune here, not in code.
#
#   [tune]          how a design is built, wanted and judged
#   [alias]         words a mind may use for a stuff, and the bit they mean ("iron" is metal)
#   [stuff]         named lists of stuffs, for [part] to share
#   [part]          what each part in view/assets/parts.json can be made of (a list, or the name of a [stuff] list), the
#                   likeliest first; a part named in a stuff it cannot be is made of the first. A stuff is a bit
#                   (house.toml, crafting.toml, building.toml): a part is real, and one in hand is used up
#   [effect.<name>] does: what happens in the house (the card says it); fail: why it did not (the plain hint); hint: what
#                   would have done it, said to a practised designer
#     provide       the ways it is provided, any one of which will do. Each is a condition on one part, or
#                   `all = [condition, ...]`, each met by a different part. A condition: `part` (any of these parts),
#                   `of` (made of one of these stuffs), `prop` (made of a stuff that can be one of these), `not_of`
#     boost         a part that makes it stronger (a lens throws a light forward); best: stuffs that make it stronger
#     use           what a working thing does: the use in view/assets/uses.json whose `effect` it has (engine/invent.py
#                   does them all, as for an invention); a light with a handle, a strap or a pole to carry it by is a
#                   "carried light", and goes where its owner goes
#     show          what the room shows while it works (o.effect_on): light, heat, cold, sound, pour, float, carry ...

[tune]
small = 3                 # a design of this many parts or fewer is built in one sitting at the bench
spells = 3                # a bigger one takes this many spells of work, and one more for a fifth part
rest_hours = 5            # world hours between two spells of work on a big design (so it takes a world day or two)
together = 1.6            # a spell of work with another hob at it too
big = ["hull", "plank", "barrel", "ladder", "tank", "firebox"]   # a design on one of these is big: built in the yard, where there is room
want = 5.0                # how strongly a design in hand is wanted finished
need = 2.2                # how strongly a need nothing in the house meets is wanted designed for
fix = 3.0                 # how strongly what a failed design lacked is wanted
season = 2.0              # times this while designing has its season
recent_hours = 12         # a failed design of its own or its family's this recent offers designing again
stale_days = 3            # a design nothing has been done on for this long is given up
variety = 0.25            # no kind of design (what it is mainly for) is more than this share of the house's designs ...
variety_after = 4         # ... once the house has this many
show_minutes = 20         # world minutes a working effect shows in the room after it is built or used
cost = 3                  # buying back a thing that matters: this many of the machine's materials
strength = { base = 0.4, skill = 0.12, best = 0.2, boost = 0.1 }   # how well a working effect works, 0 to 1
nowhere = ["ice"]         # stuffs a part may be of that the house has no way to get yet

