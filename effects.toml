# ---- the effects (§2): every design is made of these ----

[effect.light]
does = "it lights the way around it"
fail = "nothing in it glows"
hint = "a flame, a candle, a wick of wax or a glowing stone would"
provide = [{ part = ["flame", "candle", "ember", "glow stone", "fireflies"] }, { part = ["wick", "bulb"], of = ["wax", "clear wax", "resin", "amber"] }]
boost = ["lens", "mirror", "lamp shade"]
best = ["clear wax", "amber", "glass"]
use = "lamp light"
show = "light"

[effect."soft light"]
does = "it lights a room at night without costing anyone comfort"
fail = "nothing in it glows softly: a bare flame is harsh"
hint = "a glow under a shade, or a glowing stone, would"
provide = [{ part = ["glow stone", "fireflies"] }, { all = [{ part = ["flame", "candle", "ember", "wick", "bulb"] }, { part = ["lamp shade", "dome", "jar", "cloth", "quilt", "bottle"] }] }]
best = ["amber", "clear wax", "cloth"]
use = "soft light"
show = "light"

[effect.heat]
does = "it warms whoever is near it"
fail = "nothing in it is warm"
hint = "a fire in something that holds it, or coals, would"
provide = [{ part = ["ember", "flame", "firebox"] }, { part = ["candle", "wick"], of = ["wax", "clear wax", "resin"] }, { part = ["block", "plate", "pot"], of = ["fired brick", "warm stone", "warm metal"] }]
boost = ["firebox", "bellows"]
best = ["metal", "fired brick", "charcoal"]
use = "heater"
show = "heat"

[effect.cold]
does = "it cools whoever is near it"
fail = "nothing in it is cold"
hint = "ice, or a fan that is turned, or a damp clay pot, would"
provide = [{ part = ["ice"] }, { all = [{ part = ["propeller", "bellows"] }, { part = ["crank", "wind-up key", "spring", "lever"] }] }, { part = ["pot", "jar", "bowl", "bucket"], prop = ["cool"] }]
best = ["clay", "metal"]
use = "cooler"
show = "cold"

[effect.sound]
does = "it is heard all over the room"
fail = "nothing in it makes a sound"
hint = "a bell, a whistle or a horn would"
provide = [{ part = ["bell dome", "chimes", "whistle", "horn", "drum skin", "comb", "panpipes"] }, { part = ["head", "lever", "studs"], prop = ["noisy"] }]
best = ["metal", "bell", "glass"]
use = "noisemaker"
show = "sound"

[effect.signal]
does = "it is heard in the rooms next door"
fail = "nothing in it is loud enough to carry through a door"
hint = "a horn or a big bell of metal would"
provide = [{ part = ["horn", "whistle"] }, { part = ["bell dome", "chimes"], of = ["metal", "bell"] }]
best = ["metal", "bell"]
use = "signal"
show = "sound"

[effect.music]
does = "it plays a tune"
fail = "nothing in it can be tuned"
hint = "strings, a bell, a drum skin or a pipe would"
provide = [{ part = ["strings", "bell dome", "drum skin", "pipe", "panpipes", "comb", "piano keys", "chimes"] }]
boost = ["wind-up key", "box"]
best = ["wire", "metal", "reed", "felt"]
use = "instrument"
show = "sound"

[effect.cut]
does = "it cuts, as a carver does"
fail = "nothing in it has an edge"
hint = "a blade of something hard, metal or a sharp stone, would"
provide = [{ part = ["blade", "saw", "axe head", "point", "tines"], prop = ["hard"], not_of = ["wood", "carved wood", "plank"] }]
boost = ["handle"]
best = ["tempered metal", "blade", "metal"]
use = "cutter"
show = "cut"

[effect.dig]
does = "it digs, as a trowel does"
fail = "nothing in it could break the earth"
hint = "a spade or a scoop of something hard would"
provide = [{ part = ["spade", "scoop", "claw", "point", "tines"], prop = ["hard"] }]
boost = ["handle", "pole"]
best = ["metal", "tempered metal"]
use = "digger"
show = "dig"

[effect.hold]
does = "things can be kept in it"
fail = "there is nowhere in it to keep anything"
hint = "a box, a jar, a basket or a pocket would"
provide = [{ part = ["box", "jar", "pot", "basket", "bucket", "barrel", "bowl", "cup", "tank", "bottle", "pocket", "net", "cage"] }]
boost = ["lid"]
best = ["wicker", "fired clay", "wood"]
use = "holder"
show = "hold"

[effect.keep]
does = "food kept in it does not spoil"
fail = "nothing closes it up: food in it would spoil"
hint = "something to hold it in, with a lid or a cork, would"
provide = [{ all = [{ part = ["jar", "pot", "box", "barrel", "bottle", "tank", "bowl", "bucket"] }, { part = ["lid", "cork"] }] }]
best = ["glass", "fired clay", "wax"]
use = "keeper"
show = "hold"

[effect.carry]
does = "it carries several things at once, and goes where its owner goes"
fail = "nothing in it would move it along"
hint = "wheels, runners or a strap on something that holds things would"
provide = [{ all = [{ part = ["box", "basket", "bucket", "barrel", "plank", "pot", "jar"] }, { part = ["wheel", "runners", "axle", "strap", "handlebar"] }] }]
boost = ["handlebar", "handle"]
best = ["wood", "metal", "wicker"]
use = "cart"
show = "carry"

[effect.pour]
does = "it carries water to what is planted"
fail = "nothing in it would hold water and let it out"
hint = "a spout on something that holds water would"
provide = [{ all = [{ part = ["spout", "nozzle", "tap", "hose"] }, { part = ["bowl", "jar", "pot", "cup", "tank", "bucket", "bottle", "barrel"], not_of = ["wicker", "netting", "cloth", "fibre", "felt"] }] }]
boost = ["handle", "valve"]
best = ["fired clay", "metal", "glass"]
use = "pourer"
show = "pour"

[effect.roll]
does = "it rolls across a room, and kin come after it"
fail = "nothing in it rolls"
hint = "a wheel or a ball would"
provide = [{ part = ["wheel", "ball", "axle", "runners"] }]
boost = ["bell dome", "spring"]
best = ["wood", "metal"]
use = "rolling toy"
show = "roll"

[effect.float]
does = "it floats on the pond"
fail = "nothing in it would stay up on the water"
hint = "a hull or a board of wood, or a cork, would"
provide = [{ part = ["hull", "plank", "cork", "barrel", "basket"], of = ["wood", "plank", "carved wood", "reed", "dry reed", "wicker", "resin"] }]
boost = ["sail", "oar", "rudder", "paddle wheel"]
best = ["wood", "dry reed"]
use = "boat"
show = "float"

[effect.reach]
does = "it reaches the high places"
fail = "nothing in it reaches up or takes hold"
hint = "a hook or a claw on a long pole would"
provide = [{ all = [{ part = ["pole", "ladder", "stick", "bar", "arm", "tube"] }, { part = ["hook", "claw", "net", "scoop", "pulley"] }] }, { part = ["ladder"] }]
boost = ["pulley"]
best = ["wood", "metal"]
use = "reacher"
show = "reach"

[effect.grow]
does = "something can be grown in it indoors"
fail = "there is no earth in it for anything to grow in"
hint = "soil in a pot, or a sprout, would"
provide = [{ all = [{ part = ["pot", "bowl", "basket", "box", "jar", "bucket", "barrel"] }, { part = ["soil", "sprout", "flower", "seeds"] }] }]
best = ["fired clay", "mud"]
use = "planter"
show = "grow"

[effect.fasten]
does = "it joins things together, as a hammer does"
fail = "nothing in it grips or joins"
hint = "a clamp, a hinge or nails would"
provide = [{ part = ["clamp", "hinge", "studs", "head"], prop = ["hard"] }]
boost = ["handle", "lever"]
best = ["metal", "tempered metal", "nail"]
use = "fastener"
show = "fasten"

[effect.comfort]
does = "it is a good place to rest"
fail = "nothing in it is soft to rest on"
hint = "a cushion, a pad or a quilt would"
provide = [{ part = ["cushion", "pad", "quilt", "seat", "cloth"], prop = ["soft", "springy", "quiet"] }]
boost = ["legs", "spring", "seat"]
best = ["felt", "fluff", "feather"]
use = "seat or bed"
show = "comfort"

[effect.play]
does = "it is a toy"
fail = "nothing in it is any fun"
hint = "a ball, a kite, a spring or a ribbon would"
provide = [{ part = ["ball", "kite", "balloon", "ribbon", "spring", "propeller", "wind-up key", "flag", "bell dome", "wheel"] }]
boost = ["spring", "bell dome"]
best = ["felt", "cloth", "wood"]
use = "plaything"
show = "play"

[effect.catch]
does = "it fishes, as a rod does"
fail = "nothing in it would catch a fish"
hint = "a line or a hook on a pole, or a net, would"
provide = [{ part = ["net"] }, { all = [{ part = ["stick", "pole", "handle", "bar", "tube"] }, { part = ["fishing line", "hook", "cord", "net", "strings"] }] }]
boost = ["hook", "fishing line"]
best = ["wood", "string", "hook"]
use = "fishing rod"
show = "catch"

[effect.lift]
does = "it rises off the floor"
fail = "nothing in it pushes upward"
hint = "nothing the house knows of pushes upward yet"
provide = []
show = "lift"
