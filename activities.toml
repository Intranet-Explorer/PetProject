did_screen = "read the {what}"
icon = "book"
seconds = [5, 8]
base = 0.0
handles = true

# SPEC-v3.5 §4.3: the vending machine (engine/machine.py). A material one of its wants is about, and the machine has
# it: it goes over and takes one (two a day). A spare thing it wants fed to the machine: it is carried there, a room
# at a time if the machine is elsewhere, and fed in for a material back. Nothing to make with: it goes to see.
