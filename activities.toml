# SPEC-v3.4 §4.1: a word it wonders about, and the book is in the room: it goes over to it, and its mind may ask.
# Left long enough, it leafs through the book by itself, looking for the word.
["go to the book"]
do = "place"
book = true
doing = "going over to the heavy book"
did = "went over to the heavy book"
doing_screen = "going over to the {what}"   # (SPEC-v3.5.3 §10: at one of the machine room's screens, the screen's own name)
did_screen = "went over to the {what}"
icon = "book"
seconds = [2, 3]
base = 0.0

# (13 October 2026) one too young to read goes over to an elder instead, and its mind may ask out loud.
