# What a pet's body does by itself between thoughts (SPEC-v3.3 §1.1). No model is asked: each tick a pet that is
# not carrying out something it decided picks the best of these for the moment and does it. Add an activity here and
# the body can do it; `do` names the way it is carried out (engine/body.py), and several activities can share one.
#
#   doing     what it is doing, as the page says it ("playing with the {what}")
#   did       what it did, as the pet is told afterwards ("played with the {what}")
#   icon      the small sign over its head (sprite icon.act.<icon>)
#   voice     the sound it makes starting it, in its own voice (murmur, hum, chirp, yawn, laugh, greet, grumble, gasp)
#   seconds   how long it takes once it is there, least and most (world seconds)
#   base      how likely it is with nothing else to say
#   needs     which feelings pull toward it: need -> weight, counted by how bad that need is (0 fine to 1 at its worst)
#   temper    which temperaments lean toward it: gene -> weight, counted from the middle (a gene of 1 adds the weight)
#   focus     the kinds of thing its mind may want to be about (§1.2) that this serves
#   when      the hour or the sky that suits it: dusk, night, day, morning, storm, rain, music -> bonus
#   passive   resting, looking and watching: together kept under a quarter of its waking time
#   fidget    (SPEC-v3.4 §1) filler, not an activity: one tick long, done on the spot between two activities or while a
#             thought is on its way, never chosen as the thing to do, and not counted as anything done
#   handles   (SPEC-v3.4 §0) it picks up, uses, carries or puts away the thing it names: counted as a thing handled
#   rest      done in a resting pose (lying or sitting down): the only way it stays put for long
#   stage     the youngest that does it
#   effects   what it does to the pet when done, in the same units as config.toml [effects] (it wears with repeating)
#   needs_tool, needs_place   (Phase B) a tool it must be carrying, or a fixture it must be at; unused so far

[wander]
do = "wander"
doing = "wandering about"
did = "wandered about"
icon = "walk"
seconds = [3, 6]
base = 0.5                       # (walking about the room, not through a door: it keeps v3.4's paws busy and legs moving)
temper = { curious = 0.4, bold = 0.2 }
focus = ["explore"]

["look about"]
do = "self"
doing = "looking about"
did = "looked about"
icon = "eye"
seconds = [2, 2]
base = 0.7
passive = true
temper = { curious = 0.2 }
fidget = true

[stretch]
do = "self"
doing = "having a stretch"
did = "stretched"
icon = "stretch"
voice = "yawn"
seconds = [2, 2]
base = 0.7
needs = { energy = 0.6 }
fidget = true

[groom]
do = "self"
doing = "grooming itself"
did = "groomed yourself"
icon = "groom"
seconds = [2, 2]
base = 0.8
needs = { comfort = 0.4 }
effects = { comfort = 0.3 }
