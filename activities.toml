# SPEC-v3.4 §2.1, §3.1: a bit it wants to try something on is carried to where that can be tried (the water, the
# heat, the bench, the earth). What comes of it is its mind's to find out: there it is told, and thinks sooner.
["take to try"]
do = "place"
doing = "carrying its {what} {where}"
did = "carried the {what} {where}"
icon = "paws"
seconds = [2, 3]
base = 0.0
handles = true

["try it"]
