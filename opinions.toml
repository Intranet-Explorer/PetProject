# SPEC-v4.0 §4: what moves one hob's opinion of another (or of the visitor), and by how much. engine/opinions.py reads it.
# Only opinions.move changes an opinion, and only by a cause listed here; every change is recorded with its cause.
#
# [causes.<name>]
#   liking (-10..10), trust, fear, respect (0..10): the change, for the one who holds the opinion. A caller may pass
#       its own amounts (gossip, a conversation's direction, a migration's history): they are clamped to these sizes.
#   memory = n   also a memory of weight n (1-5) for the holder, in the words given to move; 4 fades slowly, 5 never
#   heavy = true the change does not fade back toward neutral (true for memory 4 and up as well)
#   mood         the holder's mood from it; pride, safety: the holder's needs move by this much

[neutral]
liking = 0
trust = 5
fear = 0
respect = 5

[fading]
per_day = 0.15            # what share of a light feeling drifts back toward neutral each world day
small_per_day = 0.4       # ... and of a small dislike (liking from -3 to below nothing): it is forgotten soon (19 October 2026, the house soured)

[memories]
fade_days = 2             # a light memory loses a point of weight every this many world days ...
heavy_fade_days = 10      # ... a weight-4 one every this many (gone in 40 days); weight 5 never fades (19 October 2026: 4 never did)
heavy_keep = 20           # of the 50 a hob keeps, at most this many weigh 4 or 5 (the lightest and oldest of them go first)

[gossip]
pull = 0.35               # how far the listener moves toward what it was told, times its trust in the teller / 10
lie_chance = 0.6          # a sly hob (honest at -1) invents this often; less sly, less often
found_per_day = 0.25      # the chance each world day that a listener finds a lie out

[bonds]
close_liking = 8          # a close bond forms by itself (also in a conversation: talk.py) at this liking both ways ...
close_trust = 7           # ... and this trust both ways ...
close_causes = 6          # ... once this many things have passed between them
break_liking = 3          # ... and breaks when either's liking falls below this
friend = 5                # friends: liking above this both ways
enemy = -5                # enemies: liking below this either way
rival = 0.3               # rivals: both at least this ambitious, chasing the same thing

[causes.kin]
liking = 4
trust = 3
heavy = true

