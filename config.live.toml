# The live profile (11 October 2026): the family that began as the fourth showcase run, carried on where anyone
# can watch it, off turbo, a tick every 4 real seconds. Since 12 October 2026 its world day is two real hours
# (1800 ticks), twice the showcase's: a life of about 16 world days was over in a night with nobody watching.
# Nothing else moved: a tick, a step, a thought and every rate take as long as they did; what is counted in world
# days and hours (a life, a stage, a night, a season, what regrows) takes twice as long. Started with
# ./run.sh start live. Everything below [clock] is config.showcase.toml's and must stay the same as it.

[clock]
day_seconds = 3600        # the world's own day
was_day_seconds = 1800    # ... and what it was: a house that lived by the old day keeps its clock and its ages (world.wt)
real_day_seconds = 7200   # what a visitor sees: one world day in two hours, so a tick is 4 real seconds
turbo = false

[life]
egg_minutes = 5
lifespan_days = 13
adult_days = 4
egg_pull_days = 1
neglect_days = 0.5

[growth]
child = 1.5
youngling = 3
adult = 5

[house.house]             # SPEC-v3.5 §5: on the two-hour day a season is three and a half real days, so all four pass in two weeks
season_days = 42
was_season_days = 6       # ... and what it was: a house that lived by the short seasons keeps the season it is in (season.settle)

[house.events]            # merged over house.toml: a short life should still meet a few events
every_hours = 7
drift_after_days = 6

[sleep]
think = "low"             # the night's thinking, capped (amendment): a short night must not cost minutes of model time

[model]
night_tokens = 3000
