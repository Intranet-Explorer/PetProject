"gives things names" = ["playful+"]
"chews on string" = ["patient-"]
"stares at the rain" = ["patient+"]
"walks the long way round" = ["curious+"]
"eats the best bit last" = ["patient+"]
"eats the best bit first" = ["patient-"]
