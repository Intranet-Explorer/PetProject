# SPEC-v4.2 §6.1-6.2 (helper C, engine/drives.py, [drives] on): a drive, drawn at hatching. leans: the axes that make a
# hob likelier to have it (as [values]; a parent's drive counts too); flaws: those that work against it, of which the
# hob is given one (weighted by [flaws] leans). What each drive serves and each flaw does is drives.SERVES and FLAW_SCORE.
[drives."to be remembered"]
leans = ["ambitious+"]
flaws = ["envious", "proud", "lazy"]
[drives."to be loved by one"]
leans = ["social+", "kind+"]
flaws = ["clinging", "hot", "envious"]
[drives."to find out what the visitor is"]
leans = ["curious+"]
flaws = ["proud", "fearful", "dishonest"]
[drives."to make the thing nobody has made"]
leans = ["ambitious+", "curious+"]
flaws = ["envious", "fearful", "greedy"]
[drives."to keep the family safe"]
leans = ["kind+", "brave+"]
flaws = ["hot", "fearful", "clinging"]
[drives."to leave the house"]
leans = ["brave+", "social-"]
flaws = ["fearful", "clinging", "lazy"]
[drives."to know everything in the book"]
leans = ["curious+", "patient+"]
flaws = ["proud", "lazy", "greedy"]
[drives."to be left alone"]
leans = ["social-"]
flaws = ["hot", "dishonest", "greedy"]

[flaws]
proud = ["ambitious+"]
envious = ["generous-", "ambitious+"]
fearful = ["brave-"]
greedy = ["generous-"]
lazy = ["patient-", "ambitious-"]
hot = ["kind-", "patient-"]
dishonest = ["honest-"]
clinging = ["social+", "brave-"]

# SPEC-v4.2.2 §2 the voice card, the engine's alone: its style, drawn by the traits (contracts.STYLES says each in a line),
# and what it cares about, from its drive, in plain words ("to be loved by one" cares about its one, by name, once it has one).
[voice.style]
sunny = ["social+", "kind+"]
eager = ["social+", "playful+"]
fussy = ["tidy+"]
big-sister = ["brave+"]
gentle = ["patient+", "kind+"]
easygoing = ["patient+", "ambitious-"]
grumbly = ["kind-"]
know-it-all = ["curious+"]
[voice.cares]
"to be remembered" = "being remembered for something"
"to be loved by one" = "someone special"
"to find out what the visitor is" = "finding out what the visitor is"
"to make the thing nobody has made" = "making something new"
"to keep the family safe" = "keeping the family safe"
"to leave the house" = "getting out of the house"
"to know everything in the book" = "the book"
"to be left alone" = "being left alone"
