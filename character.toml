"keeps a secret corner" = ["honest-", "social-"]
"mutters about the weather" = ["kind-"]
"sighs loudly" = ["kind-"]
"laughs at its own jokes" = ["playful+"]
"stands very straight" = ["ambitious+"]
"wants to be first through a door" = ["ambitious+", "patient-"]
"naps after every meal" = ["ambitious-"]
"keeps score of everything" = ["ambitious+"]
