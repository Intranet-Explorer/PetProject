# Hob names (SPEC-v3.5.8 §2, engine/names.py). A hob naming an egg is offered five names from different sources;
# one of them is a name from this bank. Add a name to any group (commas or new lines between names), or add a group:
#
#   [bank.<group>]
#   why = what the offer says of a name from it ("an old Welsh name")
#   names = """ Name, Name, Name """
#
# A name is a name a hob can have only if it is easy to say, at most 16 letters, and not made of the family's words
# (`vocabulary` below): engine/check_names.py checks every name here against the same rules.

# The family's words: what the hobs say, call their things and named their young before v3.5.8 ("Rain Rest", "Open
# Hand", "Grey Light II", "Open Hour"), and room, furniture and bit words that read as a phrase. A name made only of
# these is a phrase, not a name. The words of any hob's two-word name in the house count too (names.family_words).
vocabulary = """
rest rests resting restless quiet quietly hush open opening light lights lit seed seeds sprout dusk dawn rain rains
rainy grey gray stone stones hum hums humming hand hands spring springs springy echo echoes warm warmth dark darkness
soft softness calm still stillness moss mossy hour hours first second third fourth fifth sixth one two three four five
six last other old new fall falls fallen glow glows bright wait waiting settle settling shape nest petal petals vine
breath hold held keep kept keeper morning night nights day days evening noon sun sunny shade shadow ease slow stop
step heart root roots leaf leaves water deep low high home here there between green white black blue red yellow
purple brown small big long short near far under over after before sleep sleepy dream wake tune sound whisper signal
pulse bond shared share together alone gentle tender lost found kind true safe cold cool heavy hollow empty full edge
mark line path way place space part whole same ring loop knot drop drip flow lean leaning fold thread weave woven
patch draught roof door window wall floor shelf shelves box bed curtain row bush frame lining niche bench crate crates
sign screen machine rug pipe bowl chest toy plant rock trunk chair stool cushion mat tile cup basket lamp charm totem
token bead holder marker keepsake piece bit lump blob dot pad cellar attic nursery garden greenhouse pond storeroom
workshop music hub room house hall north south east west clay sand wood fibre fiber metal tinder soot resin string
wire glass cloth felt wax stick twig bark mud dust ash ember smoke fire flame chalk grit cord rope glue dye ink plank
fluff lily quill wicker mesh brick bell bells chime chimes nook hearth visitor egg eggs hob hobs family mother father
parent child little thing things something nothing someone song songs sing singing hymn wish wishing hope listen
listening watch watching tend tending mend mending made making gather gathering gift gifts quietness bloom blooming
growing grow grown dry wet damp mist misty fog frost snow storm wind breeze cloud cloudy sky moon star stars
"""

# Something from its own life comes out as a name: these words become these names (anything else is its word, if
# that is a name).
[life]
